<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Context Before Consequence</title>
  <style>
    body { width: 250px; font-family: Arial, sans-serif; margin: 12px; color: #172033; }
    h2 { color: #2c3e50; text-align: center; margin: 0 0 12px; font-size: 18px; }
    .toggle-container, .sensitivity { margin: 12px 0; padding: 10px; background: #ecf0f1; border-radius: 4px; }
    .toggle-container { display: flex; justify-content: space-between; align-items: center; }
    .toggle-label, label { font-weight: bold; }
    .toggle-switch { position: relative; display: inline-block; width: 40px; height: 20px; }
    .toggle-switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; inset: 0; background: #ccc; transition: .2s; border-radius: 20px; }
    .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 2px; bottom: 2px; background: white; transition: .2s; border-radius: 50%; }
    input:checked + .slider { background: #27ae60; }
    input:checked + .slider:before { transform: translateX(20px); }
    input:focus-visible + .slider, button:focus-visible, input[type=range]:focus-visible { outline: 3px solid #2563eb; outline-offset: 2px; }
    .sensitivity input { width: 100%; margin: 8px 0 4px; }
    .sensitivity output, .hint { display: block; font-size: 12px; line-height: 1.35; }
    .hint { color: #475569; margin-top: 6px; }
    .status { padding: 8px; background: #ecf0f1; border-radius: 4px; margin: 10px 0; text-align: center; font-size: 14px; }
    .privacy-log { margin-top: 10px; padding: 10px; background: #f8f9fa; border-radius: 4px; font-size: 12px; }
    .privacy-log h3 { margin: 0 0 8px; color: #2c3e50; font-size: 14px; }
    .log-item { margin: 5px 0; padding: 5px; background: white; border-radius: 2px; overflow-wrap: anywhere; }
    .used { border-left: 3px solid #27ae60; }
    .not-used { border-left: 3px solid #e74c3c; color: #475569; }
    button { width: 100%; padding: 8px; background: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
    button:hover { background: #2980b9; }
  </style>
</head>
<body>
  <h2>Context Before Consequence</h2>
  <div class="toggle-container">
    <span class="toggle-label">Extension</span>
    <label class="toggle-switch" aria-label="Enable Context Before Consequence">
      <input type="checkbox" id="toggle-checkbox">
      <span class="slider"></span>
    </label>
  </div>
  <div class="sensitivity">
    <label for="sensitivity-slider">Sensitivity</label>
    <input id="sensitivity-slider" type="range" min="0" max="2" step="1" value="1" aria-describedby="sensitivity-hint">
    <output id="sensitivity-value" for="sensitivity-slider">Balanced — medium and high risk</output>
    <span class="hint" id="sensitivity-hint">Higher sensitivity shows more context checks. This preference is saved.</span>
  </div>
  <div class="status" id="status-text" role="status">Loading...</div>
  <div class="privacy-log">
    <h3>Last Action Privacy Log</h3>
    <div id="privacy-log-content">No actions yet</div>
  </div>
  <button id="clear-log-btn">Clear Log</button>
  <script src="popup.js"></script>
</body>
</html>
